<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" font-family="Segoe UI, system-ui, sans-serif">
  <!-- The operating loop: one record from enquiry to invoice. Palette matches the print set. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9fb3ba"/>
    </marker>
  </defs>

  <!-- connecting rail -->
  <line x1="78" y1="64" x2="922" y2="64" stroke="#d9dde1" stroke-width="2"/>

  <!-- stages -->
  <g text-anchor="middle">
    <!-- 1 Enquiry -->
    <g>
      <circle cx="86" cy="64" r="26" fill="#0f4c5c"/>
      <text x="86" y="71" fill="#ffffff" font-size="20" font-weight="600">1</text>
      <text x="86" y="122" fill="#16191d" font-size="17" font-weight="600">Enquiry</text>
      <text x="86" y="146" fill="#4a5158" font-size="13">one queue,</text>
      <text x="86" y="164" fill="#4a5158" font-size="13">one owner, one clock</text>
    </g>
    <!-- 2 Quote -->
    <g>
      <circle cx="252" cy="64" r="26" fill="#0f4c5c"/>
      <text x="252" y="71" fill="#ffffff" font-size="20" font-weight="600">2</text>
      <text x="252" y="122" fill="#16191d" font-size="17" font-weight="600">Quote</text>
      <text x="252" y="146" fill="#4a5158" font-size="13">priced in seconds</text>
      <text x="252" y="164" fill="#4a5158" font-size="13">where a rate card covers</text>
    </g>
    <!-- 3 Award -->
    <g>
      <circle cx="418" cy="64" r="26" fill="#0f4c5c"/>
      <text x="418" y="71" fill="#ffffff" font-size="20" font-weight="600">3</text>
      <text x="418" y="122" fill="#16191d" font-size="17" font-weight="600">Award</text>
      <text x="418" y="146" fill="#4a5158" font-size="13">acceptance becomes</text>
      <text x="418" y="164" fill="#4a5158" font-size="13">a shipment — nothing retyped</text>
    </g>
    <!-- 4 Execution -->
    <g>
      <circle cx="584" cy="64" r="26" fill="#0f4c5c"/>
      <text x="584" y="71" fill="#ffffff" font-size="20" font-weight="600">4</text>
      <text x="584" y="122" fill="#16191d" font-size="17" font-weight="600">Execution</text>
      <text x="584" y="146" fill="#4a5158" font-size="13">milestones, customs,</text>
      <text x="584" y="164" fill="#4a5158" font-size="13">containers, running clocks</text>
    </g>
    <!-- 5 Documents -->
    <g>
      <circle cx="750" cy="64" r="26" fill="#0f4c5c"/>
      <text x="750" y="71" fill="#ffffff" font-size="20" font-weight="600">5</text>
      <text x="750" y="122" fill="#16191d" font-size="17" font-weight="600">Documents</text>
      <text x="750" y="146" fill="#4a5158" font-size="13">generated from the file,</text>
      <text x="750" y="164" fill="#4a5158" font-size="13">versioned, released</text>
    </g>
    <!-- 6 Invoice -->
    <g>
      <circle cx="916" cy="64" r="26" fill="#0f4c5c"/>
      <text x="916" y="71" fill="#ffffff" font-size="20" font-weight="600">6</text>
      <text x="916" y="122" fill="#16191d" font-size="17" font-weight="600">Invoice</text>
      <text x="916" y="146" fill="#4a5158" font-size="13">from the shipment's own</text>
      <text x="916" y="164" fill="#4a5158" font-size="13">ledger, in the right entity</text>
    </g>
  </g>

  <!-- arrows between stages -->
  <g stroke="#9fb3ba" stroke-width="2" marker-end="url(#arr)">
    <line x1="118" y1="64" x2="214" y2="64"/>
    <line x1="284" y1="64" x2="380" y2="64"/>
    <line x1="450" y1="64" x2="546" y2="64"/>
    <line x1="616" y1="64" x2="712" y2="64"/>
    <line x1="782" y1="64" x2="878" y2="64"/>
  </g>

  <!-- the point -->
  <g>
    <line x1="86" y1="16" x2="916" y2="16" stroke="#0f4c5c" stroke-width="1.5"/>
    <line x1="86" y1="10" x2="86" y2="22" stroke="#0f4c5c" stroke-width="1.5"/>
    <line x1="916" y1="10" x2="916" y2="22" stroke="#0f4c5c" stroke-width="1.5"/>
    <rect x="400" y="2" width="200" height="28" fill="#ffffff"/>
    <text x="500" y="21" text-anchor="middle" fill="#0f4c5c" font-size="14" font-weight="600" letter-spacing="1.5">ONE RECORD, NO EXITS</text>
  </g>
</svg>
