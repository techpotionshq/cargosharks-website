# Qabandi in production — the two containers, as one stack.
#
# Deliberately not `compose.dev.yaml`. That file is the local stack: Postgres
# with a password of `postgres`, MinIO with a published key, every port bound to
# the host. Deploying it would put those on the internet. Compose does not pick
# either filename up on its own, so neither can be picked up by accident.
#
# ## Why there is almost nothing here
#
# Coolify writes the application's runtime variables to a `.env` and loads it
# into every service through `env_file`, so anything set in the UI already
# reaches both containers and both apps read it from `process.env`.
#
# Restating a variable here is therefore not just redundant, it is destructive:
# `environment:` takes precedence over `env_file`, so a forwarding line like
# `SMTP_HOST: ${SMTP_HOST:-}` overwrites the value Coolify delivered with an
# empty string. This file used to carry thirty of them.
#
# The rule: declare a value only if this file must decide it and the operator
# must not. Today that is one.
#
# ## Deploying it
#
#   Build pack               Docker Compose
#   Docker Compose Location  /compose.prod.yaml
#
# Press **Load Compose File** before saving. Coolify does not read the file on
# its own, and until it has it does not know `web` and `service` exist — no
# per-service domain fields appear, and a stack deployed in that state gets no
# Traefik router and answers nothing at all.
#
# Then set a domain on `web`, and on `web` only. The service has no public
# domain: its two public prefixes, `/api/v1` and `/webhooks`, are served
# through the web container (`apps/web/src/lib/service-proxy.ts`), so carrier
# and provider callbacks point at `https://<web>/webhooks/...` and `/internal`
# is unreachable from outside because no route leads there.
#
# Required in the UI, or the containers exit at boot: DATABASE_URL and
# INTERNAL_API_SECRET on both (identical — a mismatch is a 401 the web app
# reports as "the document could not be generated"), BETTER_AUTH_SECRET and
# BETTER_AUTH_URL for web, WEB_URL for the service. That last one is the
# address the service writes into outbound links (and its CORS origin); it is
# no longer derived from BETTER_AUTH_URL here, and its config default of
# `http://localhost:3000` fails without saying so.
#
# Everything else degrades honestly against the defaults in `config.ts`.
#
# No `container_name`, `restart` or `networks` keys: Coolify manages all three,
# and a custom network puts containers on two at once, which Traefik then
# routes to non-deterministically.

services:
  # The interface. Also the migration runner, on exactly one deployment —
  # RUN_MIGRATIONS plus MIGRATION_DATABASE_URL, set nowhere else.
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # No target — the web image is the last stage in the file.
    environment:
      # The one value this file decides.
      #
      # Hard-coded rather than `${SERVICE_URL}` so it cannot be pointed at the
      # service's public domain from a text box. `/internal` authenticates the
      # caller with a shared secret and then lets that caller name the
      # principal to act as; that is not an endpoint to put behind Traefik to
      # save a virtual network hop.
      #
      # `service` is the key below, so this line and that key move together.
      SERVICE_URL: http://service:3001

  # Documents, storage, the public API, and every scheduled worker — free-time
  # accrual, SLA escalation, notification dispatch, the FX feed. Without this
  # container nothing has a clock running on it, and a document download
  # answers 503: the web app never holds the storage credentials, it asks this
  # container to sign a link.
  service:
    build:
      context: .
      dockerfile: Dockerfile
      target: service
