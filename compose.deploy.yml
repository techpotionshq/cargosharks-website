# Qabandi in production — the two containers, as one stack.
#
# This is deliberately *not* `docker-compose.yml`. That file is the local
# dependency stack: Postgres with a password of `postgres`, MinIO with a
# published key, a mail sink, all three bound to host ports. Pointing a
# deployment at it would put those on the internet. The two files never pick
# each other up either — `docker compose up` at the root still gets the dev
# stack, because this filename is not one Compose looks for on its own.
#
# ## Why this file is nearly empty
#
# It used to restate the whole environment — `S3_BUCKET: ${S3_BUCKET}`,
# `SMTP_HOST: ${SMTP_HOST:-}`, thirty more like them — and every one of those
# lines was worse than useless.
#
# Coolify writes the application's runtime variables to a `.env` and loads it
# into **every service in the stack** through `env_file`. So anything set in
# the UI already reaches both containers, and `apps/service/src/config.ts` and
# the web app read it straight from `process.env`. Restating it here changes
# nothing when it works — and `environment:` takes precedence over `env_file`,
# so a line like `SMTP_HOST: ${SMTP_HOST:-}` *overwrites* the value Coolify
# delivered with an empty string the moment nobody also defined SMTP_HOST as a
# compose-interpolation variable. The file was quietly deleting configuration
# it appeared to be forwarding.
#
# So the rule here: declare a variable only if this file must decide it and the
# operator must not. Today that is exactly one.
#
# ## What the operator sets, in Coolify
#
# Required — the containers exit at boot without them:
#
#   DATABASE_URL           both
#   INTERNAL_API_SECRET    both, and identical; a mismatch is a 401 the web app
#                          reports as "the document could not be generated"
#   BETTER_AUTH_SECRET     web
#   BETTER_AUTH_URL        web
#   WEB_URL                service — the CORS origin and the base for links in
#                          outgoing mail. This file used to derive it from
#                          BETTER_AUTH_URL; it no longer does, and the config
#                          default is `http://localhost:3000`, which fails as a
#                          CORS origin without saying so. Set it.
#
# Everything else degrades honestly against the defaults in `config.ts` —
# `MAIL_DRIVER` logs instead of sending, `FX_SOURCE` and
# `CARRIER_TRACKING_DRIVER` leave a person typing the milestone. Add
# `S3_*` for documents, `MAILBOX_ENCRYPTION_KEY` for mailboxes (the same value
# on both, or the web app seals a password the service cannot open),
# `RUN_MIGRATIONS` + `MIGRATION_DATABASE_URL` on exactly one deployment.
#
# ## In Coolify
#
#   Build pack               Docker Compose
#   Docker Compose Location  /compose.deploy.yml
#
# Then press **Load Compose File** before saving. Coolify does not read the
# file on its own, and until it has, it does not know `web` and `service`
# exist — no per-service domain fields appear, the stack deploys with no
# Traefik router, and the site answers nothing at all. Skipping that button is
# not a misconfiguration you can see anywhere in this file.
#
# Then set a domain on `web`, and on `service` only if carrier webhooks or the
# public tracking API are in use — `/internal` refuses proxied requests, so a
# domain on the service does not expose it.
#
# No `container_name`, `restart` or `networks` keys below: Coolify manages all
# three, and a custom network in particular puts containers on two networks at
# once, which Traefik then routes to non-deterministically.

services:
  # The interface. Also the migration runner, on exactly one deployment.
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # No target — the web image is the last stage in the file.
    environment:
      # The one value this file decides.
      #
      # Hard-coded rather than `${SERVICE_URL}` so it cannot be set to the
      # service's public domain from the UI. `/internal` authenticates the
      # caller with a shared secret and then lets that caller *name the
      # principal to act as* — routing it through Traefik would put an
      # impersonation endpoint on the internet, protected by one string, to
      # save a virtual network hop.
      #
      # `service` is the key below, so this line and that key move together.
      SERVICE_URL: http://service:3001

  # Documents, storage, the public API, and every scheduled worker — free-time
  # accrual, SLA escalation, notification dispatch, the FX feed. Without this
  # container the product has no clock running on anything, and a document
  # download answers 503: the web app never holds the storage credentials, it
  # asks this container to sign a link.
  service:
    build:
      context: .
      dockerfile: Dockerfile
      target: service
