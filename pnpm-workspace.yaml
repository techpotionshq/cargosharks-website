# `minimumReleaseAge: 10080` belongs here and is deliberately not here yet.
#
# It is the setting with the most teeth of the three below: nearly every npm
# compromise of recent years was found and yanked within hours to days of
# publication, and the damage landed on whoever installed inside that window.
# A seven-day floor does not make a package trustworthy — it makes somebody
# else the one who finds out.
#
# Turning it on today breaks every install instead. `pnpm install
# --frozen-lockfile` refuses, because the committed lockfile pins four packages
# published inside the window — framer-motion, motion, motion-dom and
# deepmerge-ts, all from 20–21 August 2026. A supply-chain control that turns
# CI red on the day it lands gets reverted by the next person to hit it, which
# leaves the repository with neither the control nor the reason it was wanted.
#
# The youngest of those was published 2026-08-21, so this can be uncommented
# from **28 August 2026** with no other change. Verify with `pnpm install
# --frozen-lockfile` before pushing; if it refuses, the message names the
# package and the date it becomes acceptable.
#
# The standing cost is worth stating too: a genuinely urgent security patch is
# held for seven days as well. Pin the fixed version explicitly in the manifest
# when that happens — an exception with a name on it, rather than turning the
# floor off for everything.
#
# minimumReleaseAge: 10080
#
# nosemgrep: package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
packages:
  - 'packages/*'
  - 'apps/*'

# Supply-chain settings, all three of which exist to slow an attack down rather
# than to detect one. The `supply-chain` job audits what is already installed;
# these govern what is allowed to become installed in the first place.
#
# Refuses a transitive dependency resolved from a git URL, a tarball URL or a
# local path. A direct dependency declared that way is a decision somebody made
# and can be read in the manifest; the same thing arriving four levels down is
# a fetch from somewhere no lockfile audit is looking.
blockExoticSubdeps: true

# Stops a package update from quietly relaxing the settings above. A downgrade
# of a security setting is not a thing a legitimate version bump needs to do.
trustPolicy: no-downgrade

# Build scripts are opt-in under pnpm 10+. Only what genuinely needs one.
allowBuilds:
  esbuild: true
  '@swc/core': true
  '@parcel/watcher': true
  # Arrived with the OTLP trace exporter. Its install script only regenerates
  # the bundled protobuf wrappers, which ship prebuilt in the tarball — nothing
  # in the exporter's runtime path needs it, and leaving it undeclared makes
  # `pnpm install` exit non-zero and take CI with it.
  protobufjs: false

# Transitive advisories, forced up. Both are reported by `pnpm audit`, which
# the `supply-chain` job now fails on — so these are the alternative to
# switching that gate off, and each names why it is here rather than waiting
# for its parent to bump.
#
# `deepmerge-ts` is the one that mattered. It is reached through
# `mailparser -> html-to-text`, and mailparser reads a real inbox that anyone
# on the internet can write to (`docs/Dev_Environment.md`). Stack exhaustion
# in a recursive merge is therefore a crash a stranger can post, not a paper
# finding. 8.x is API-compatible for the single call html-to-text makes.
#
# `esbuild` arrives under `drizzle-kit -> @esbuild-kit/esm-loader`, which is
# tooling and ships in neither runtime image; the advisory is against its dev
# server, which nothing here starts. Overridden anyway, because an audit gate
# carrying a standing exception is one somebody eventually stops reading.
#
# `fast-uri` arrives under `fastify` (both the 3.x and 4.x lines, via ajv), and
# the service is the thing on the internet. Host-confusion and request-forgery
# advisories in the URI parser a public API validates with are not paper
# either. Each line is held to its own major, so neither jumps a version its
# parent was not written for.
#
# `brace-expansion` arrives under the OpenTelemetry auto-instrumentation's glob
# matching — a DoS by recursion, patched within 2.x.
#
# `@grpc/grpc-js` arrives under the OpenTelemetry SDK's OTLP gRPC exporters.
# The advisory (getAuthContext returning an unauthorised certificate) was
# published after the others; the fix is a patch release within 1.14.
overrides:
  deepmerge-ts: '>=8.0.0'
  esbuild: '>=0.25.0'
  fast-uri@3: '>=3.1.7 <4'
  fast-uri@4: '>=4.1.4 <5'
  brace-expansion@2: '>=2.1.6 <3'
  '@grpc/grpc-js@1': '>=1.14.5 <2'
  ip-address@10: '>=10.7.1 <11'
