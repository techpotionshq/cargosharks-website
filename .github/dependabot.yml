# Dependabot — the other half of `security.yml`.
#
# The `audit` job there says an advisory exists. This opens the pull request
# that closes it. Without both, somebody has to notice a red build and then do
# the bump by hand, which is the step that gets postponed.
#
# Weekly rather than daily, and grouped rather than one PR per package. A team
# of this size will read one pull request a week and will ignore fourteen.
#
# Every ecosystem carries a seven-day cooldown. A version published this morning
# has not yet been looked at by anybody, and nearly every npm compromise of
# recent years was found and yanked within days of publication — so waiting a
# week does not make a release trustworthy, it makes somebody else the one who
# finds out. The weekly schedule already means a bump waits on average three
# days; this makes the floor explicit rather than incidental.
#
# It is the counterpart to `minimumReleaseAge` in `pnpm-workspace.yaml`, which
# is written out there but not yet switched on. This half costs nothing to turn
# on today: it delays a proposed update, where the other would refuse an
# install.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Kuwait
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # Everything that is only a build or test concern, in one PR. These
      # cannot reach a customer, so they are read for breakage, not for risk.
      development:
        dependency-type: development
        update-types: [minor, patch]
      # Runtime, minor and patch, in a second. A major goes on its own,
      # because a major is a decision rather than a bump.
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    labels: [dependencies]
    commit-message:
      # The house style is imperative prose — `CLAUDE.md`.
      prefix: 'chore'
      include: scope

  # The runtime image's base layer. `pnpm audit` cannot see it and Trivy only
  # reports it; this is the thing that raises the version.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Kuwait
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: 'chore'

  # The actions in `ci.yml` and `security.yml` are third-party code that runs
  # with a token. A pinned action that is never updated is a supply-chain risk
  # of its own.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: 'chore'
