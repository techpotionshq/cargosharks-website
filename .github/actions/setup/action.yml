# pnpm, Node and the workspace's dependencies, the same way in every job.
#
# Written for a self-hosted runner that outlives the job, which a GitHub-hosted
# VM does not (docs/CI.md):
#
# - pnpm goes into `runner.temp`, which the runner empties after every job,
#   rather than the default `~/setup-pnpm`, which two runner instances on one
#   machine would overwrite under each other.
# - The pnpm store is cached through GitHub only on GitHub-hosted runners. On
#   the self-hosted machine the store already persists on disk between jobs,
#   so restoring a tarball of it would download hundreds of megabytes to
#   overwrite files that are already there, while another job may be reading
#   them.
# - `next-cache` keeps `apps/web/.next/cache` between jobs, on a self-hosted
#   runner that names a cache directory of its own (below).
#
# Actions are pinned to commit SHAs for the reasons given at the top of ci.yml.

name: Setup
description: Install pnpm and Node, then the workspace's locked dependencies.

inputs:
  node-version:
    description: Node major version.
    required: true
  pnpm-version:
    description: pnpm version, matching `packageManager` in package.json.
    required: true
  next-cache:
    description: >-
      A name for this job's Next.js build cache (`e2e-offline`, `build`, ...).
      Empty, the default, keeps no cache. Used only where the runner sets
      QABANDI_CI_CACHE.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The commit `v4` points at (v4.3.0). This line used to carry
    # f40ffcd9..., which is the annotated tag object for `v4` rather than a
    # commit: `git ls-remote` lists it as `refs/tags/v4`, with this SHA as
    # `refs/tags/v4^{}`. A pin has to name the commit.
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        version: ${{ inputs.pnpm-version }}
        dest: ${{ runner.temp }}/setup-pnpm

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Turbopack's build cache, kept between runs. Measured on this repository:
    # `next build` of apps/web takes about 50s cold and 8s warm.
    #
    # `actions/checkout` runs `git clean -ffdx`, which deletes `.next` with
    # everything else that is ignored, so the cache cannot simply stay in the
    # workspace. Instead `.next/cache` is a symlink into a directory the runner
    # keeps. Next empties `.next` at the start of a build but spares the entry
    # named `cache`, so the link survives the build that follows it.
    #
    # Only where the runner sets QABANDI_CI_CACHE (infra/ci-runner), and that
    # directory must belong to one runner alone: one runner is one job at a
    # time, so nothing ever writes the same Turbopack cache twice at once. Two
    # builds sharing one would corrupt it. One directory per job kind, because
    # the offline and seeded builds and the production build differ in their
    # environment and would otherwise evict each other on every run.
    - name: Link the Next.js build cache
      if: inputs.next-cache != ''
      shell: bash
      env:
        NAME: ${{ inputs.next-cache }}
      run: |
        if [ -z "${QABANDI_CI_CACHE:-}" ]; then
          echo "QABANDI_CI_CACHE is not set on this runner; building without a persistent cache."
          exit 0
        fi
        dir="$QABANDI_CI_CACHE/next/$NAME"
        mkdir -p "$dir" apps/web/.next
        rm -rf apps/web/.next/cache
        ln -s "$dir" apps/web/.next/cache
        echo "apps/web/.next/cache -> $dir ($(du -sh "$dir" | cut -f1))"
