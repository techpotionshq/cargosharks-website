# Third-party actions are pinned to full commit SHAs, with the version they
# were at in the trailing comment. Please do not "tidy" them back to `@v4`.
#
# A tag is mutable: whoever owns the action can repoint it, and both
# `tj-actions/changed-files` and `trivy-action` have been repointed in real
# supply-chain attacks. These workflows hold a `GITHUB_TOKEN` and, in the
# database jobs, live connection strings, so an action that changes under us
# changes what can read those. Dependabot understands pinned SHAs and will
# raise the bumps as pull requests, which is where a version change belongs.
#
# The supply chain — the half of the build nobody writes.
#
# `ci.yml` proves the code in this repository behaves. It says nothing at all
# about the 651 packages underneath it, and that is where a platform sold with
# support gets compromised: not in a feature, in a transitive dependency of a
# mail parser.
#
# Separate from `ci.yml` for one reason, and it is the reason this file exists
# rather than a sixth job over there: **an advisory is published on a day
# nobody commits.** A scan that only runs on push reports "clean" for as long
# as the repository is quiet, which is exactly when it is least true. So this
# runs on every change *and* every Monday, and the schedule is the half that
# does the work.
#
# Four checks, each answering a different question:
#
#   audit        do our dependencies have known advisories today
#   secrets      did a credential ever reach a commit, anywhere in history
#   image        does the runtime image carry a vulnerable OS package
#   sbom         what, exactly, did we ship — an artifact a customer can ask for
#
# What runs when. Secrets and static analysis are cheap and read the code a
# pull request changes, so they run on every one. The other three can only
# change answer when the dependency tree or the image changes, or when the
# world does: on a pull request they run only if it touches the lockfile, a
# `package.json`, the workspace file or the Dockerfile; every push to main or
# qabandi and the Monday schedule run all five. Runner selection (`CI_RUNNER`)
# is explained at the top of ci.yml.
#
# NFR-18 (operability) and the handover obligation in Architecture §13: after
# handover the patching duty is Al-Qabandi's, and a duty with no alarm attached
# is a sentence in a runbook.

name: Security

on:
  push:
    branches: [main, qabandi]
  pull_request:
  schedule:
    # Monday 04:00 UTC — 07:00 in Kuwait, before the working week starts.
    # Sunday-to-Thursday is the week here, so Monday morning is the second day
    # of it and somebody is already at a desk to read a failure.
    - cron: '0 4 * * 1'
  workflow_dispatch:

# Pull requests cancel their own stale runs; a push or the schedule never
# waits on, or is cancelled by, another (see ci.yml).
concurrency:
  group: security-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.5.2'

jobs:
  # Whether this pull request changes what is installed or what is shipped.
  # Anything other than a pull request answers yes.
  scope:
    name: Dependency scope
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || fromJSON('["self-hosted","linux","x64","qabandi-ci"]') }}
    timeout-minutes: 5
    outputs:
      deps: ${{ steps.scope.outputs.deps }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The merge commit and the base branch's tip; see ci.yml's `scope`.
          fetch-depth: 2

      - id: scope
        run: |
          deps=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
            pattern='^(pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc|Dockerfile|\.dockerignore|(.*/)?package\.json|\.github/workflows/security\.yml|\.github/actions/)'
            printf '%s\n' "$files" | grep -Eq "$pattern" || deps=false
          fi
          echo "deps=$deps" | tee -a "$GITHUB_OUTPUT"

  audit:
    name: Dependency advisories
    needs: scope
    if: needs.scope.outputs.deps == 'true'
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || fromJSON('["self-hosted","linux","x64","qabandi-ci"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # `high` and above fails the build; `moderate` is reported and does not.
      #
      # The split is deliberate. A gate that fails on every moderate advisory
      # in a 651-package tree fails most weeks for something unreachable, and a
      # gate that fails most weeks is one somebody adds `|| true` to. The two
      # advisories this repository started with are pinned out in
      # `pnpm-workspace.yaml`, each with a note on why.
      - name: Advisories, high and above
        run: pnpm audit --audit-level high

      - name: Advisories, everything else
        if: always()
        run: pnpm audit --audit-level moderate || true

  secrets:
    name: Secret scan
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || fromJSON('["self-hosted","linux","x64","qabandi-ci"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Whole history, not the default single commit. A credential that was
          # committed and then removed is still a credential — the commit is
          # what leaked it, and `git log -p` is a public API on any repository
          # somebody is given.
          fetch-depth: 0

      # TruffleHog rather than gitleaks: the gitleaks action requires a paid
      # licence key for organisation-owned repositories, and a scan that is off
      # because a key expired is worse than one that was never added.
      #
      # `--only-verified` means it reports credentials it has confirmed are
      # live against the issuing service, not strings that look like keys. The
      # false-positive rate is what decides whether anyone reads this job.
      - name: Verified credentials in history
        uses: trufflesecurity/trufflehog@8c3e7bad3f4e708b080b9b19974007c06ac1ef16 # main as of 2026-08-25
        with:
          extra_args: --only-verified

  image:
    name: Runtime image
    needs: scope
    if: needs.scope.outputs.deps == 'true'
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || fromJSON('["self-hosted","linux","x64","qabandi-ci"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The image is what runs, and `pnpm audit` cannot see any of it: the base
      # layer's OpenSSL is not in the lockfile.
      #
      # Two builds, not one. This used to say "both apps ship from one
      # Dockerfile, so one build covers them", which was wrong in a way nobody
      # could see while the scan step was broken: `docker build .` builds the
      # *final* stage only, and `service` is not it. So the service image — the
      # one carrying pnpm, Chromium and a row of apt packages, and therefore the
      # larger surface of the two — has never been scanned at all. A control
      # that claims coverage it does not have is worse than one that claims
      # nothing.
      #
      # Tagged by run, not `qabandi:scan`: the self-hosted runner's Docker
      # daemon is shared by every job on the machine, so a fixed tag is one a
      # concurrent run can retag between this build and the scan below. The
      # last step removes both whatever happens.
      - name: Build the web runtime image
        run: docker build -t "qabandi-scan:${{ github.run_id }}-${{ github.run_attempt }}-web" .

      - name: Build the service image
        run: docker build --target service -t "qabandi-scan:${{ github.run_id }}-${{ github.run_attempt }}-service" .

      - name: Scan
        # v0.28.0 is permanently broken, which is why this job has never run: it
        # calls `aquasecurity/setup-trivy@v0.2.1` by tag, and that tag has since
        # been deleted upstream, so the action fails to resolve before Trivy is
        # ever invoked. The oldest setup-trivy tag still published is v0.2.6.
        # v0.36.0 pins its own dependency by SHA rather than by tag, which is
        # the fix for the class as well as the instance.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: qabandi-scan:${{ github.run_id }}-${{ github.run_attempt }}-web
          format: table
          # OS packages and language dependencies both, CRITICAL and HIGH.
          #
          # The comment here used to say "CRITICAL only", which is not what the
          # line below does and never was — nobody caught it because the job
          # could not resolve its action and so has never once scanned an image.
          # What actually protects against the case it was worried about — a
          # base image carrying HIGH findings with no fix available for weeks,
          # where failing the build means pinning to a stale digest to stay
          # green — is `ignore-unfixed: true` on the next line but one. A HIGH
          # with a fix available is a bump somebody can actually make.
          #
          # If this proves too noisy on the first real runs, narrow `severity`
          # rather than dropping `ignore-unfixed`.
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Scan the service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: qabandi-scan:${{ github.run_id }}-${{ github.run_attempt }}-service
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

      # The layers stay in the build cache, which is what makes the next build
      # fast; only the two tags go. Pruning the cache is the machine's job
      # (docs/CI.md), not a job's.
      - name: Remove the scanned images
        if: always()
        run: >-
          docker image rm -f
          "qabandi-scan:${{ github.run_id }}-${{ github.run_attempt }}-web"
          "qabandi-scan:${{ github.run_id }}-${{ github.run_attempt }}-service"
          || true

  sast:
    name: Static analysis
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || fromJSON('["self-hosted","linux","x64","qabandi-ci"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Semgrep, not CodeQL, and the reason is billing rather than preference.
      #
      # CodeQL is the better engine and it is free only on public repositories:
      # on a private one it needs GitHub Advanced Security, which is priced per
      # committer and is not worth it for a team this size. Semgrep's OSS rules
      # run anywhere, need no account and no token, and cover what matters here
      # — injection, XSS sinks, weak crypto, hard-coded secrets.
      #
      # If this repository is ever made public, or GHAS is bought for another
      # reason, replace this job with `github/codeql-action` and delete the
      # note. Until then, an engine that runs beats a better one that does not.
      #
      # `docker run` rather than a job `container:`. A container job runs its
      # steps as root, so the checkout it leaves behind is root-owned, and on a
      # self-hosted runner the next job's checkout of the same workspace then
      # fails to clean it. Run as the runner's own user (root in the Coolify
      # container, where root owns the workspace anyway), with a named container
      # so the step after can remove it if the job is cancelled mid-scan.
      #
      # `$PWD` is a path inside the runner, and the daemon that resolves the
      # bind mount is the host's. They agree only because the runner's work
      # directory is mounted at the same path on both (infra/ci-runner); the
      # TruffleHog action's `-v .:/tmp` depends on the same thing.
      - name: Scan
        run: >-
          docker run --rm
          --name "semgrep-${{ github.run_id }}-${{ github.run_attempt }}"
          --user "$(id -u):$(id -g)"
          -e HOME=/tmp
          -v "$PWD:/src" -w /src
          semgrep/semgrep
          semgrep scan
          --config p/typescript
          --config p/react
          --config p/nodejs
          --config p/secrets
          --config p/owasp-top-ten
          --config p/sql-injection
          --error
          --skip-unknown-extensions
          --exclude apps/landing/out
          --exclude '**/dist/**'
          --exclude '**/.next/**'

      - name: Remove the scanner container
        if: always()
        run: docker rm -f "semgrep-${{ github.run_id }}-${{ github.run_attempt }}" >/dev/null 2>&1 || true

  sbom:
    name: Bill of materials
    needs: scope
    if: needs.scope.outputs.deps == 'true'
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || fromJSON('["self-hosted","linux","x64","qabandi-ci"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Not a gate. An artifact.
      #
      # "Send us your SBOM" is on every enterprise security questionnaire and
      # in the CAIQ (`docs/compliance/CAIQ.md`, SEF and AIS domains). Producing
      # one on demand means someone reconstructing the tree by hand under
      # deadline; producing one every build means answering with a link.
      - name: Generate
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: cyclonedx-json
          artifact-name: qabandi-sbom.cyclonedx.json
          output-file: qabandi-sbom.cyclonedx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: qabandi-sbom.cyclonedx.json
          retention-days: 90

  # The check to require, if any of these is to gate a merge: it always runs,
  # and a job the scope skipped counts as a pass.
  result:
    name: Security result
    needs: [scope, audit, secrets, image, sast, sbom]
    if: always()
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || fromJSON('["self-hosted","linux","x64","qabandi-ci"]') }}
    timeout-minutes: 5
    steps:
      - name: Results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "scope, audit, secrets, image, sast, sbom -> $RESULTS"

      - name: Fail if a needed job did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
