# Lint, types, tests and the production build, on every pull request and push
# to main.
#
# GitHub-hosted runners: the self-hosted ones are registered to the product
# repository, and this site's whole check takes a couple of minutes.
# Actions are pinned to commit SHAs; the tag each one is sits beside it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Format and lint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Production build
        run: pnpm build
