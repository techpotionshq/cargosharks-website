# Where this runs, and how to move it.
#
# Every job runs on the self-hosted runner labelled `qabandi-ci`, because the
# GitHub-hosted minutes ran out. The labels live in one expression repeated on
# each job (`runs-on` cannot read `env`, so it cannot be a variable here):
#
#   runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || fromJSON('[...]') }}
#
# With the repository variable `CI_RUNNER` unset, that is
# ["self-hosted","linux","x64","qabandi-ci"]. To fall back to GitHub-hosted
# runners without a commit, set `CI_RUNNER` (Settings, Secrets and variables,
# Actions, Variables) to the JSON string "ubuntu-latest", quotes included. Any
# JSON label array works too, for example ["self-hosted","linux","big"].
# Delete the variable to come back. docs/CI.md has the runner's requirements.
#
# Not every change runs every job. The first job, `scope`, reads the pull
# request's diff (scripts/ci-scope.mjs) and the rest run only when the change
# can fail them; pushes to main and qabandi run everything. The last job,
# `CI result`, always runs and is the one check branch protection needs: a
# skipped job is a pass, a failed or cancelled one is not.
#
# Third-party actions are pinned to full commit SHAs, with the version they
# were at in the trailing comment. Please do not "tidy" them back to `@v4`.
#
# A tag is mutable: whoever owns the action can repoint it, and both
# `tj-actions/changed-files` and `trivy-action` have been repointed in real
# supply-chain attacks. These workflows hold a `GITHUB_TOKEN` and, in the
# database jobs, live connection strings, so an action that changes under us
# changes what can read those. Dependabot understands pinned SHAs and will
# raise the bumps as pull requests, which is where a version change belongs.
#
# The pipeline — Architecture §13.
#
# Nothing in this repository ran on a commit before this file existed. That is
# the first thing a second customer's technical reviewer asks about, and the
# reason the answer matters more than any feature gap: a platform sold with
# support is a platform someone else has to trust you to change safely.
#
# Five jobs, ordered by how fast they fail (plus `scope` before and `CI result`
# after):
#
#   checks    formatting, lint, the dependency-direction check, types, and
#             the unit suites (engines, web, service: no database, no network)
#   database  migrations, seed, and the RLS policy matrix on real Postgres 18
#   e2e       every screen, in both languages, offline and on a seeded database
#   build     the production build both apps ship as
#
# Sized for a shared machine (docs/CI.md, "Sharing the machine"). The runners
# are two containers of two CPUs each on a host that also serves the demos, so
# every job is written to stay inside that: vitest and Playwright run two
# workers, Node's heap is capped for the builds, Postgres is started without
# durability it does not need, and caches persist on the runner so a job
# spends its two CPUs on the change rather than on reinstalling the world.
#
# `database` and `e2e` are the two that could not exist before: the first needs
# Postgres 18 specifically (§6.4 — `uuidv7()` and temporal `WITHOUT OVERLAPS`),
# and the second needs an interface that renders without a database, which
# `QABANDI_PILOT_FIXTURES` provides.

name: CI

on:
  push:
    # Both long-lived branches: `check-branch-identity` judges a push by the
    # branch it lands on (docs/Branches.md).
    branches: [main, qabandi]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run it makes stale. A push to main or
# qabandi gets a group of its own (`run_id`), so a merge is never cancelled or
# left waiting behind the merge before it: each one is the record of what
# landed.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.5.2'
  # Next writes its telemetry consent under the runner user's home directory,
  # which outlives the job on a self-hosted machine.
  NEXT_TELEMETRY_DISABLED: '1'
  # Two test workers, not one per core. Node reports the host's eight cores
  # inside a container limited to two, so vitest's default (cores minus one)
  # would start seven workers and the scheduler would throttle all of them.
  # Read by vitest itself (4.x); `playwright.config.ts` does the same for
  # Playwright when `CI` is set.
  VITEST_MAX_WORKERS: '2'

jobs:
  # What the change can break. Pushes, the schedule and the manual button
  # answer "everything"; a pull request answers from its own diff. Needs only
  # git and Node, so it is done before anything else has installed.
  scope:
    name: Change scope
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || fromJSON('["self-hosted","linux","x64","qabandi-ci"]') }}
    timeout-minutes: 5
    outputs:
      typecheck: ${{ steps.scope.outputs.typecheck }}
      unit: ${{ steps.scope.outputs.unit }}
      database: ${{ steps.scope.outputs.database }}
      e2e_offline: ${{ steps.scope.outputs.e2e_offline }}
      e2e_full: ${{ steps.scope.outputs.e2e_full }}
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The pull request's merge commit and its first parent, the base
          # branch's tip: `HEAD^1..HEAD` is exactly what merging would change.
          fetch-depth: 2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - id: scope
        run: node scripts/ci-scope.mjs

  # One job for everything that needs an install and no service: formatting,
  # lint, types and the unit suites. They used to be two jobs, which on two
  # runners meant two checkouts and two installs for about three minutes of
  # work, and a second job queued behind the first more often than not.
  #
  # Each check runs even when one before it failed (`!cancelled()`), so a
  # formatting slip does not hide a broken test; none runs when the install
  # itself failed, because then every one of them would fail for that reason.
  checks:
    name: Checks
    needs: scope
    # Always, whatever the scope says: formatting and the repository
    # invariants are the floor every change is held to, docs included.
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || fromJSON('["self-hosted","linux","x64","qabandi-ci"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Every job configures itself from one committed file, rather than from
      # its own `env:` block. The blocks drifted, and the drift was invisible:
      # `apps/service` parses `process.env` at import and exits 1 when the shape
      # is wrong, so its suite died before a single test body ran and had never
      # once executed in CI. `.env.ci` says what it holds and what it
      # deliberately does not — connection strings and the signing key stay in
      # the workflow, beside the things that create them.
      - name: Configure the environment
        run: cp .env.ci .env

      - name: Formatting
        run: pnpm format:check

      # oxlint, plus the checks that encode decisions rather than style:
      # dependency direction (core <- db <- apps), message-catalogue parity
      # between en and ar, and internal documentation links.
      - name: Lint and repository invariants
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm lint

      # Skipped for a change that holds no code (markdown, docs), which no
      # compiler reads. Runs if `scope` itself failed, since then nobody knows.
      - name: Types
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.scope.outputs.typecheck != 'false' }}
        run: pnpm typecheck

      # The engines: six charge calculations, one clock, one working-calendar
      # duration function. No database is configured here deliberately — if
      # these ever need one, that is the finding.
      - name: Domain engines
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.scope.outputs.unit != 'false' }}
        run: pnpm test:core

      - name: Web unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.scope.outputs.unit != 'false' }}
        run: pnpm --filter @qabandi/web test

      # The adapter mapping — carrier event vocabulary to our milestone codes.
      # No provider account, deliberately: the translation is the half that
      # fails quietly, and it has to be checkable on every commit.
      - name: Service unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.scope.outputs.unit != 'false' }}
        run: pnpm --filter @qabandi/service test

  database:
    name: Migrations, seed and RLS policies
    needs: scope
    if: needs.scope.outputs.database == 'true'
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || fromJSON('["self-hosted","linux","x64","qabandi-ci"]') }}
    timeout-minutes: 20

    services:
      postgres:
        # 18, not 16 or 17. `uuidv7()` is the default for every primary key and
        # temporal `WITHOUT OVERLAPS` carries rate-card validity (§6.4).
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qabandi
          # Durability off, because this database is thrown away with the job.
          #
          # A service container takes `env` and `docker create` options but no
          # command, so `postgres -c fsync=off` cannot be passed the usual way.
          # `initdb -c` (Postgres 16 and later) writes the settings into the
          # generated postgresql.conf, and the image hands POSTGRES_INITDB_ARGS
          # to initdb: the server, including the temporary one the image runs
          # during initialisation, starts with them. The alternatives were
          # worse. Overriding the entrypoint loses the image's initialisation;
          # a `docker run` step loses the health check, the port read-back
          # (`job.services.postgres.ports`) and the cleanup the runner does
          # when a job is cancelled. The step "Durability settings" below
          # prints what the server actually runs with.
          #
          # fsync, synchronous_commit and full_page_writes off: every commit
          # returns without waiting on a disk. max_wal_size because the data
          # directory is a tmpfs (below) and WAL would otherwise grow to 1GB
          # before a checkpoint reclaimed it.
          POSTGRES_INITDB_ARGS: >-
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
            -c max_wal_size=256MB
        # The container's 5432 on a host port Docker picks. A fixed `5432:5432`
        # is a collision the moment two jobs with a database share the machine,
        # or the machine runs a Postgres of its own; the next step reads the
        # port back.
        ports:
          - 5432
        # The data directory in memory, and the container held to one CPU and
        # 2GB with a low CPU weight. It runs beside the runner container, not
        # inside it, so the runner's limits (infra/ci-runner) do not reach it.
        #
        # tmpfs rather than the image's anonymous volume: no disk writes at all
        # on a disk the demos also use, and no volume left behind per job
        # (the image declares VOLUME /var/lib/postgresql, and Postgres 18 keeps
        # PGDATA under it). The suites write tens of megabytes; 1GB is
        # headroom, and it counts against the 2GB.
        options: >-
          --health-cmd "pg_isready -U postgres -d qabandi"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
          --tmpfs /var/lib/postgresql:rw,size=1g
          --cpus 1
          --memory 2g
          --cpu-shares 256

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Configure the environment
        run: cp .env.ci .env

      # Provisioning runs as the superuser; everything after it does not.
      # `db:provision` takes each role's password from its own connection
      # string, so these three are the whole configuration. Written to the job's
      # environment here rather than in `env:`, because the host port is only
      # known once the service container is up.
      - name: Point at this job's database
        env:
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          {
            echo "PGPORT=$PGPORT"
            echo "ADMIN_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:$PGPORT/qabandi"
            echo "MIGRATION_DATABASE_URL=postgres://app_migrator:ci_migrator@127.0.0.1:$PGPORT/qabandi"
            echo "DATABASE_URL=postgres://app_user:ci_user@127.0.0.1:$PGPORT/qabandi"
          } >> "$GITHUB_ENV"

      # What the server is running with, as one line in the log. If the image
      # ever stops passing POSTGRES_INITDB_ARGS to initdb, this is where it
      # shows: the job still passes, only slower. Never fails the job.
      - name: Durability settings
        continue-on-error: true
        run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U postgres -d qabandi -tAc
          "select string_agg(name || '=' || setting, ' ' order by name) from pg_settings
          where name in ('fsync','synchronous_commit','full_page_writes','max_wal_size')"

      # The same `01-roles.sql` the local container mounts, applied the way a
      # managed instance needs it. The two paths cannot drift, which is the
      # point of `db:provision` existing at all.
      - name: Provision roles
        run: pnpm db:provision

      - name: Migrate
        run: pnpm db:migrate

      - name: Seed reference data and the permission matrix
        run: pnpm db:seed

      # The suites get a database of their own — the rule `.env.example` has
      # stated all along, and CI was the last place still breaking it.
      #
      # Both suites below *write*: `test:db` inserts fixtures and asserts over
      # them, and the mutation suites `coverage` measures post invoices and
      # payments. Pointing them at `qabandi` meant the database this job had
      # just proved it could build from an empty server was then mutated by the
      # first suite, seeded on top by `db:seed-demo`, and read by the second —
      # three steps sharing one database in an order nothing enforced. That is
      # a flake waiting for a slow day, and it makes a coverage figure that
      # nobody can reproduce.
      #
      # `qabandi_test` is built by the same three commands and thrown away with
      # the runner. `qabandi` stays untouched after `db:seed`, which is the
      # migration proof this job is named for.
      #
      # `ADMIN_DATABASE_URL` names `postgres` rather than the database being
      # created: `db:provision` connects with it *first* and then issues the
      # CREATE DATABASE, so it cannot name a database that does not exist yet.
      - name: Provision, migrate and seed the test database
        env:
          ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ env.PGPORT }}/postgres
          MIGRATION_DATABASE_URL: postgres://app_migrator:ci_migrator@127.0.0.1:${{ env.PGPORT }}/qabandi_test
          DATABASE_URL: postgres://app_user:ci_user@127.0.0.1:${{ env.PGPORT }}/qabandi_test
        run: |
          pnpm db:provision
          pnpm db:migrate
          pnpm db:seed

      # The suite connects as `app_user` — no BYPASSRLS, no ownership. Running
      # it as the owner would pass while proving nothing, so the two URLs below
      # are deliberately different roles.
      - name: RLS policies and the negative matrix
        env:
          TEST_DATABASE_URL: postgres://app_user:ci_user@127.0.0.1:${{ env.PGPORT }}/qabandi_test
          TEST_MIGRATION_DATABASE_URL: postgres://app_migrator:ci_migrator@127.0.0.1:${{ env.PGPORT }}/qabandi_test
        run: pnpm test:db

      # Coverage runs *here*, in the job that has a database, rather than
      # alongside the unit tests.
      #
      # The mutation suites — the money actions especially — skip without
      # `TEST_DATABASE_URL`, and they cover the code where an error costs money
      # rather than a re-render. Measuring in the database-less job reports a
      # figure several points below the truth and, worse, would let the
      # thresholds be satisfied while the tests that matter never ran.
      #
      # The floor in vitest.config.ts is set just under what this achieves.
      # Raise it when coverage rises; a threshold that is never raised stops
      # meaning anything.

      # The coverage run needs the demo dataset, not just the reference seed.
      #
      # `src/features/imports/*.test.ts` asserts against `KWSWK` — Shuwaikh —
      # and that location is created by `db:seed-demo`, not by `db:seed`. Six
      # assertions there had nothing to fail against, which is why the coverage
      # step died before writing a report and the job reported "No files were
      # found with the provided path: coverage/" rather than a threshold miss.
      #
      # The seeded end-to-end job already loads it in exactly this position, so
      # this is the same combination rather than a new one. It runs after the
      # policy matrix so that suite still measures a database holding only what
      # a real deployment starts with.
      #
      # It loads into `qabandi_test` for the same reason the suites do:
      # `db:seed-demo` writes as `app_user` through `withActor` — deliberately,
      # because a seed that runs as the owner can insert rows no policy would
      # allow — which makes it a mutation like any other.
      - name: Load the demo dataset
        env:
          MIGRATION_DATABASE_URL: postgres://app_migrator:ci_migrator@127.0.0.1:${{ env.PGPORT }}/qabandi_test
          DATABASE_URL: postgres://app_user:ci_user@127.0.0.1:${{ env.PGPORT }}/qabandi_test
        run: pnpm db:seed-demo

      - name: Coverage
        env:
          DATABASE_URL: postgres://app_user:ci_user@127.0.0.1:${{ env.PGPORT }}/qabandi_test
          MIGRATION_DATABASE_URL: postgres://app_migrator:ci_migrator@127.0.0.1:${{ env.PGPORT }}/qabandi_test
          TEST_DATABASE_URL: postgres://app_user:ci_user@127.0.0.1:${{ env.PGPORT }}/qabandi_test
          TEST_MIGRATION_DATABASE_URL: postgres://app_migrator:ci_migrator@127.0.0.1:${{ env.PGPORT }}/qabandi_test
        run: pnpm coverage

      # When the gate refuses, say by how much.
      #
      # `pnpm coverage` prints a full per-file table and then exits 1 with the
      # thresholds it missed — but that is thousands of lines up in a log whose
      # tail is the Postgres container dump, so in practice the answer to "how
      # far off are we" costs a download of the artifact. The four numbers that
      # decide the gate are the ones worth having at the end of the log, next to
      # the failure, where the person reading it already is.
      #
      # `if: failure()` so it costs nothing on a green run, and reads the
      # `json-summary` reporter that `vitest.config.ts` already emits.
      # Written to the job summary as well as stdout, and the summary is the half
      # that matters. A failing job's log tail is the Postgres service
      # container's own output — roughly two hundred lines the runner prints at
      # teardown — so anything a step logs is pushed out of reach of whoever is
      # reading the failure through the API rather than the web UI. The summary
      # is attached to the check itself and survives that.
      - name: Coverage totals
        if: failure()
        run: >-
          node -e "const t=require('./coverage/coverage-summary.json').total;
          const rows=['lines','statements','functions','branches'].map(k=>k.padEnd(11)+String(t[k].pct)+'%  ('+t[k].covered+'/'+t[k].total+')');
          console.log(rows.join('\n'));
          require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,
          '### Coverage totals\n\n\`\`\`\n'+rows.join('\n')+'\n\`\`\`\n')"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # The interface is tested twice, because it can be stood up two ways and both
  # are things we promise.
  #
  #   offline  no database at all. Proves the claim the pilot rests on — a
  #            laptop with nothing provisioned renders the product — and runs
  #            in about a minute with no services.
  #   full     Postgres 18 with `db:seed-demo` loaded. Every screen, and the
  #            configuration a demo instance for a prospect actually runs.
  #
  # The offline job covers a subset today: the register queries behind finance,
  # network, operations and reference have no `usePilotFixtures()` branch, so
  # those routes need a database. `e2e/support/harness.ts` lists them by name
  # and the run reports them as skipped-with-a-reason rather than passing over
  # them silently.

  e2e-offline:
    name: End-to-end (no database)
    needs: scope
    if: needs.scope.outputs.e2e_offline == 'true'
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || fromJSON('["self-hosted","linux","x64","qabandi-ci"]') }}
    timeout-minutes: 25

    env:
      QABANDI_PILOT_FIXTURES: '1'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          next-cache: e2e-offline

      - name: Configure the environment
        run: cp .env.ci .env

      # Chromium into the tool cache, and its system libraries only if the
      # runner image lacks them (`.github/actions/playwright` says how it
      # checks).
      - uses: ./.github/actions/playwright

      # A port nothing else on the machine holds, rather than a fixed 3100: a
      # second job on the same runner, or a stale server from a cancelled one,
      # would otherwise answer this job's requests.
      - name: Pick a free port for the web server
        run: |
          port=$(node -e "const s=require('net').createServer().listen(0,'127.0.0.1',()=>{console.log(s.address().port);s.close()})")
          echo "E2E_PORT=$port" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_URL=http://127.0.0.1:$port" >> "$GITHUB_ENV"

      # Built and served as production, not `next dev`: RTL, brand tokens and
      # server components all behave differently under the dev server, and it
      # is the production build these tests are supposed to protect.
      # `next start` runs as production, so `instrumentation.ts` refuses to boot
      # without a signing key — which is what it is there for. Both end-to-end
      # jobs were never given one, so the web server died on every restart
      # attempt and Playwright failed on "Timed out waiting for webServer"
      # without a single test having run. The symptom named the timeout and not
      # the cause, which is why this went unfixed for four runs.
      #
      # Generated per run rather than pinned: a fixed base64 string sitting in a
      # workflow file is a key that looks real, gets copied into a deployment,
      # and signs sessions somebody else can mint.
      - name: Generate a signing key for this run
        run: >-
          echo "BETTER_AUTH_SECRET=$(node -e
          "console.log(require('crypto').randomBytes(32).toString('base64'))")"
          >> "$GITHUB_ENV"

      # A ceiling on Node's heap, inside the runner's 4GB. Turbopack's own
      # memory is native and outside it; this stops the JavaScript half from
      # growing until the container is killed rather than failing with a
      # heap error that says what happened. Next's own type check is skipped
      # because "Checks" runs tsc on this commit; see next.config.ts.
      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=3072
          QABANDI_CI_SKIP_BUILD_TYPECHECK: '1'
          QABANDI_CI_BUILD_WORKERS: '2'
        run: pnpm --filter @qabandi/web build

      - name: Run
        run: pnpm test:e2e

      # The failed specs, into the job summary. The log's last two hundred lines
      # are the runner printing the service container's output at teardown, so
      # what Playwright wrote is out of reach of anyone reading the failure
      # through the API rather than the web UI.
      - name: Failing specs
        if: failure()
        run: node scripts/e2e-summary.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-offline
          path: apps/web/playwright-report/
          retention-days: 14

  # Beside the offline run, not after it. It used to wait for the offline job
  # because one runner ran both anyway and two at once on one machine were
  # slower than one after the other. With two runners of fixed size each job
  # gets its own two CPUs, and the number of runners, not this file, decides
  # how many run at once.
  e2e-full:
    name: End-to-end (seeded database)
    needs: scope
    if: needs.scope.outputs.e2e_full == 'true'
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || fromJSON('["self-hosted","linux","x64","qabandi-ci"]') }}
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qabandi
          # Same settings as the database job; the reasons are there.
          POSTGRES_INITDB_ARGS: >-
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
            -c max_wal_size=256MB
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qabandi"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
          --tmpfs /var/lib/postgresql:rw,size=1g
          --cpus 1
          --memory 2g
          --cpu-shares 256

    env:
      E2E_MODE: full
      E2E_EMAIL: e2e@qabandi.test
      # A throwaway credential for a throwaway database. Written plainly rather
      # than as a secret: dressing it up as one invites somebody to reuse a
      # real password here.
      E2E_PASSWORD: e2eTestPassword123
      # `BETTER_AUTH_URL` is set beside the port it names, in the step that
      # picks one. Better Auth derives its origin from the request without it
      # and warns on every boot; the suite signs nobody in, but the warning is
      # noise.

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          next-cache: e2e-full

      - name: Configure the environment
        run: cp .env.ci .env

      # Chromium into the tool cache, and its system libraries only if the
      # runner image lacks them (`.github/actions/playwright` says how it
      # checks).
      - uses: ./.github/actions/playwright

      # A port nothing else on the machine holds, rather than a fixed 3100: a
      # second job on the same runner, or a stale server from a cancelled one,
      # would otherwise answer this job's requests.
      - name: Pick a free port for the web server
        run: |
          port=$(node -e "const s=require('net').createServer().listen(0,'127.0.0.1',()=>{console.log(s.address().port);s.close()})")
          echo "E2E_PORT=$port" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_URL=http://127.0.0.1:$port" >> "$GITHUB_ENV"

      - name: Point at this job's database
        env:
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          {
            echo "ADMIN_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:$PGPORT/qabandi"
            echo "MIGRATION_DATABASE_URL=postgres://app_migrator:ci_migrator@127.0.0.1:$PGPORT/qabandi"
            echo "DATABASE_URL=postgres://app_user:ci_user@127.0.0.1:$PGPORT/qabandi"
          } >> "$GITHUB_ENV"

      # What the server is running with, as one line in the log. If the image
      # ever stops passing POSTGRES_INITDB_ARGS to initdb, this is where it
      # shows: the job still passes, only slower. Never fails the job.
      - name: Durability settings
        continue-on-error: true
        run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U postgres -d qabandi -tAc
          "select string_agg(name || '=' || setting, ' ' order by name) from pg_settings
          where name in ('fsync','synchronous_commit','full_page_writes','max_wal_size')"

      - name: Provision, migrate and seed
        run: |
          pnpm db:provision
          pnpm db:migrate
          pnpm db:seed

      # The operational dataset: enquiries at every stage, shipments mid-
      # journey, invoices partly paid, containers accruing demurrage right now.
      # Without it every register renders its empty state and the assertions
      # about held shipments and three-decimal money have nothing to read.
      - name: Load the demo dataset
        run: pnpm db:seed-demo

      # Full mode signs in for real — there is no pilot short-circuit — so the
      # suite needs an account that exists. `administrator` because the sweep
      # covers `/settings/*`, which an operations manager cannot open.
      #
      # `db:seed-demo` creates the branches it references, and a role is
      # granted per branch (FR-ID-02), so this must run after it.
      - name: Create the end-to-end account
        run: >-
          pnpm db:create-user --email e2e@qabandi.test --name "E2E Operator"
          --role administrator --password "$E2E_PASSWORD"

      # `next start` runs as production, so `instrumentation.ts` refuses to boot
      # without a signing key — which is what it is there for. Both end-to-end
      # jobs were never given one, so the web server died on every restart
      # attempt and Playwright failed on "Timed out waiting for webServer"
      # without a single test having run. The symptom named the timeout and not
      # the cause, which is why this went unfixed for four runs.
      #
      # Generated per run rather than pinned: a fixed base64 string sitting in a
      # workflow file is a key that looks real, gets copied into a deployment,
      # and signs sessions somebody else can mint.
      - name: Generate a signing key for this run
        run: >-
          echo "BETTER_AUTH_SECRET=$(node -e
          "console.log(require('crypto').randomBytes(32).toString('base64'))")"
          >> "$GITHUB_ENV"

      # Heap ceiling and type check: see the offline job.
      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=3072
          QABANDI_CI_SKIP_BUILD_TYPECHECK: '1'
          QABANDI_CI_BUILD_WORKERS: '2'
        run: pnpm --filter @qabandi/web build

      - name: Run
        run: pnpm test:e2e

      # The failed specs, into the job summary. The log's last two hundred lines
      # are the runner printing the service container's output at teardown, so
      # what Playwright wrote is out of reach of anyone reading the failure
      # through the API rather than the web UI.
      - name: Failing specs
        if: failure()
        run: node scripts/e2e-summary.mjs

      # What the database held and what the signed-in account could see of it.
      #
      # Placed *after* the suite rather than before it, and that position is the
      # whole point. A register that renders nothing has two causes needing
      # opposite fixes — the seed wrote nothing, or the rows are there and RLS
      # is filtering them out for this principal — and `/jobs rendered no record
      # to open` cannot tell them apart.
      #
      # It ran before the build first, which was useless: Playwright writes tens
      # of thousands of lines, so by the end of the job the answer was ~50,000
      # lines above the tail and reachable only through the web UI. That is the
      # same mistake the coverage totals made, and the same fix — put the number
      # where the person reading the failure already is. `$GITHUB_STEP_SUMMARY`
      # covers the browser; the end of the log covers everyone else.
      #
      # The suite reads far more than it writes, so a count taken afterwards is
      # still the dataset the screens were rendering from.
      #
      # `if: always()` so a green run records the same baseline, and
      # `continue-on-error` because a diagnostic must never be the thing that
      # fails the job it is explaining.
      - name: Dataset and scope
        if: always()
        continue-on-error: true
        run: pnpm db:diagnose --as "$E2E_EMAIL"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-full
          path: apps/web/playwright-report/
          retention-days: 14

  build:
    name: Production build
    needs: scope
    if: needs.scope.outputs.build != 'none'
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || fromJSON('["self-hosted","linux","x64","qabandi-ci"]') }}
    timeout-minutes: 20
    # Heap ceiling for every Node process the builds start; see the offline
    # end-to-end job.
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      # "Checks" typechecks this commit; see typescript in next.config.ts.
      QABANDI_CI_SKIP_BUILD_TYPECHECK: '1'
      # The runner's CPU quota, which Next cannot see; see next.config.ts.
      QABANDI_CI_BUILD_WORKERS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          next-cache: build

      - name: Configure the environment
        run: cp .env.ci .env

      # A change confined to the landing site builds that and what it imports
      # (`brand`); anything else builds every package.
      - name: Build every package
        if: needs.scope.outputs.build != 'landing'
        run: pnpm build

      - name: Build the landing site
        if: needs.scope.outputs.build == 'landing'
        run: pnpm --filter "@qabandi/landing..." build

  # The one check branch protection should require. It always runs, and fails
  # only when a job that was needed failed or was cancelled; a job the scope
  # skipped is a pass. Every other job keeps its name, so checks already marked
  # required keep reporting (a skipped job reports success).
  result:
    name: CI result
    needs: [scope, checks, database, e2e-offline, e2e-full, build]
    if: always()
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || fromJSON('["self-hosted","linux","x64","qabandi-ci"]') }}
    timeout-minutes: 5
    steps:
      - name: Results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "scope, checks, database, e2e-offline, e2e-full, build -> $RESULTS"

      - name: Fail if a needed job did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
