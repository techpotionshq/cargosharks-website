# Which parts of the user guide a pull request makes out of date.
#
# Informational only, and deliberately so: a renamed button should not block a
# merge, but the person merging should see that two screenshots and a short now
# show the old name. The job prints `pnpm guide:stale` into the run's summary
# and never fails the pull request. Building and publishing the guide stay a
# person's decision (docs/guide/README.md), because they record a browser and
# speak through a paid voice model.
#
# Actions are pinned to commit SHAs for the reasons given at the top of ci.yml,
# and the runner is chosen the way described there (`CI_RUNNER`).

name: Guide

# Only on a change that can make a page, a short or a caption stale: the
# screens and what they render, the guide's own sources and its tooling. A pull
# request touching none of these has nothing to report, and on two
# self-hosted runners an install it does not need is time another job waits.
# Safe to filter by path because this check is informational and never
# required (a required check filtered out never reports, and blocks the merge).
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'docs/guide/**'
      - 'tools/guide/**'
      - 'scripts/q.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/guide.yml'
      - '.github/actions/**'

concurrency:
  group: guide-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.5.2'

jobs:
  stale:
    name: Guide staleness (informational)
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || fromJSON('["self-hosted","linux","x64","qabandi-ci"]') }}
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The merge base with the target branch has to be in the clone.
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: List what the change makes stale
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          pnpm -s guide:stale --base "$BASE" | tee stale.txt
          {
            echo '## User guide: what this change makes stale'
            echo
            echo '```'
            cat stale.txt
            echo '```'
            echo
            echo 'Rebuild with `pnpm guide:build` (only the listed pictures, recordings and steps re-render).'
          } >> "$GITHUB_STEP_SUMMARY"
